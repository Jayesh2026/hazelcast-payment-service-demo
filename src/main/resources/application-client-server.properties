# src/main/resources/application-client-server.properties
#
# Activated with: --spring.profiles.active=client-server
# (PDF Chapter 3.7)
#
# In this profile:
#  - HazelcastClientConfig (@Profile("client-server")) is active instead of
#    HazelcastConfig (@Profile("embedded"))
#  - This app becomes a Hazelcast CLIENT, connecting to standalone Hazelcast
#    member nodes defined in docker-compose.yml (hz-node1, hz-node2)

# Comma-separated Hazelcast member addresses (the standalone cluster).
# Overridden by HAZELCAST_CLIENT_ADDRESSES env var in docker-compose.yml.
hazelcast.client.cluster-members=${HAZELCAST_CLIENT_ADDRESSES:127.0.0.1:5701,127.0.0.1:5702}
hazelcast.client.cluster-name=payment-cluster

# Datasource — when running inside docker-compose, the hostname is the
# service name "postgres"; override via SPRING_DATASOURCE_URL env var.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
